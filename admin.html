<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Панель капитана · MYOU FK</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script><script src="defaults.js"></script></head>
<body><header><b>🐯 MYOU FK · Панель капитана</b><nav id="nav"></nav></header><main id="app"></main>
<script>
var sb=supabase.createClient(SB_URL,SB_KEY);
var S={P:[],M:[],R:[],user:null,m:null,tab:'players',rm:null};
var $=function(s){return document.querySelector(s)};
async function reload(){var d=await loadAll(sb);S.P=d.P;S.M=d.M;S.R=d.R}
async function save(t,row){var r=await sb.from(t).upsert(row);if(r.error){alert(r.error.message);return false}return true}
async function up(file,folder){ if(!file)return'';
 var n=folder+'/'+crypto.randomUUID()+'-'+file.name.replace(/[^\w.]/g,'_'),r=await sb.storage.from('site-media').upload(n,file);
 if(r.error){alert(r.error.message);return''} return sb.storage.from('site-media').getPublicUrl(n).data.publicUrl}
async function init(){var u=await sb.auth.getUser();S.user=u.data.user;if(S.user)await reload();render()}
async function doLogin(){var r=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});if(r.error)return alert(r.error.message);init()}
async function logout(){await sb.auth.signOut();S.user=null;render()}
var opts=function(sel){return '<option value="">— выбрать —</option>'+S.P.map(function(p){return '<option value="'+p.id+'"'+(p.id==sel?' selected':'')+'>#'+esc(p.number)+' '+esc(p.name)+'</option>'}).join('')};

function render(){
 $('#nav').innerHTML='<a class="btn g" href="index.html">Сайт команды</a>'+(S.user?' <button class="g" onclick="logout()">Выйти</button>':'');
 if(!S.user){$('#app').innerHTML='<div class="box" style="max-width:340px;margin:40px auto"><h2 style="margin-top:0">Вход капитана</h2><div class="row"><input id="em" placeholder="Email"></div><div class="row"><input id="pw" type="password" placeholder="Пароль"></div><button onclick="doLogin()">Войти</button></div>';return}
 var T=[['players','Игроки'],['match','Матч и состав'],['rate','Оценки']];
 $('#app').innerHTML='<div class="row">'+T.map(function(t){return '<button class="'+(S.tab==t[0]?'':'g')+'" onclick="S.tab=\''+t[0]+'\';render()">'+t[1]+'</button>'}).join('')+'</div>'+({players:tPlayers,match:tMatch,rate:tRate}[S.tab])();initDrag()}

function tPlayers(){
 return '<div class="box"><h2 style="margin-top:0">Добавить игрока</h2><div class="row"><input id="pnm" placeholder="Имя"><input id="pnum" class="n" placeholder="№"><input id="ppos" class="n" placeholder="Поз.">'+
 '<label class="mut">Фото <input type="file" id="pph" accept="image/*"></label></div><div class="row mut">Стартовые: '+STATS.map(function(s){return s[1]+' <input class="n" id="b_'+s[0]+'" value="60">'}).join(' ')+'</div><button onclick="addPlayer()">Добавить</button></div>'+
 '<table>'+S.P.map(function(p){return '<tr><td>#'+esc(p.number)+' <b>'+esc(p.name)+'</b> <span class="mut">'+esc(p.pos)+'</span></td><td>ОВР '+card(p,S.R).ovr+'</td><td style="text-align:right"><button class="r" onclick="rmPlayer(\''+p.id+'\')">Удалить</button></td></tr>'}).join('')+'</table>'}
async function addPlayer(){var name=$('#pnm').value.trim();if(!name)return;
 var p={id:crypto.randomUUID(),name:name,number:$('#pnum').value,pos:$('#ppos').value,photo:await up($('#pph').files[0],'players')};
 STATS.forEach(function(s){p[s[0]]=+$('#b_'+s[0]).value||60});
 if(await save('players',p)){await reload();render()}}
async function rmPlayer(id){if(confirm('Удалить игрока?')){await sb.from('players').delete().eq('id',id);await reload();render()}}

function tMatch(){
 var h='<div class="row"><select onchange="pick(this.value)"><option value="">— выбрать матч —</option>'+S.M.map(function(m){return '<option value="'+m.id+'"'+(S.m&&S.m.id==m.id?' selected':'')+'>'+esc((m.date||'').slice(0,10))+' vs '+esc(m.opponent)+'</option>'}).join('')+'</select><button onclick="newMatch()">+ Новый матч</button></div>';
 var m=S.m;if(!m)return h;
 return h+'<div class="box"><div class="row"><input type="datetime-local" value="'+esc(m.date)+'" oninput="S.m.date=this.value"><input placeholder="Против кого" value="'+esc(m.opponent)+'" oninput="S.m.opponent=this.value">'+
 '<label class="mut">Лого соперника <input type="file" accept="image/*" onchange="upLogo(this)"></label>'+(m.logo?'<img class="logo" style="width:44px;height:44px" src="'+esc(m.logo)+'">':'')+'</div>'+
 '<div class="row"><label><input type="checkbox"'+(m.played?' checked':'')+' onchange="S.m.played=this.checked"> Матч сыгран</label></div></div>'+
 '<div class="box"><h2 style="margin-top:0">Основа</h2><p class="mut">Добавьте игроков на поле и перетаскивайте их карточки куда нужно.</p><div class="row"><select onchange="addOnPitch(this.value)"><option value="">+ Добавить игрока на поле</option>'+S.P.filter(function(p){return !m.lineup.some(function(l){return l.pid==p.id})}).map(function(p){return '<option value="'+p.id+'">#'+esc(p.number)+' '+esc(p.name)+'</option>'}).join('')+'</select></div>'+pitch(m,S.P,true)+
 '<div class="row" style="margin-top:10px">'+m.lineup.map(function(l,i){var p=pn(S.P,l.pid);return '<span class="tag">'+esc(p?p.name:'?')+' <a href="#" style="color:#f88" onclick="rmPitch('+i+');return false">✕</a></span>'}).join('')+'</div></div>'+
 '<div class="box"><h2 style="margin-top:0">Замены</h2>'+m.subs.map(function(s,i){return '<div class="row"><select onchange="S.m.subs['+i+'].pid=this.value">'+opts(s.pid)+'</select><input placeholder="Когда (≈60 мин)" value="'+esc(s.when)+'" oninput="S.m.subs['+i+'].when=this.value"><input placeholder="В каких случаях" value="'+esc(s.case)+'" oninput="S.m.subs['+i+'].case=this.value"><input placeholder="Сколько играет" value="'+esc(s.dur)+'" oninput="S.m.subs['+i+'].dur=this.value"><button class="r" onclick="S.m.subs.splice('+i+',1);render()">✕</button></div>'}).join('')+'<button class="g" onclick="S.m.subs.push({});render()">+ Замена</button></div>'+
 '<div class="box"><h2 style="margin-top:0">Тактика</h2>'+m.tactics.map(function(t,i){return '<div class="row"><input placeholder="Когда (при счёте 1:0)" value="'+esc(t.when)+'" oninput="S.m.tactics['+i+'].when=this.value"><input style="flex:2" placeholder="Что делаем (все в защиту)" value="'+esc(t.what)+'" oninput="S.m.tactics['+i+'].what=this.value"><button class="r" onclick="S.m.tactics.splice('+i+',1);render()">✕</button></div>'}).join('')+'<button class="g" onclick="S.m.tactics.push({});render()">+ Тактика</button></div>'+
 '<button onclick="saveMatch()">💾 Сохранить матч</button> <button class="r" onclick="rmMatch()">Удалить матч</button>'}
function pick(id){var m=S.M.find(function(x){return x.id==id});S.m=m?JSON.parse(JSON.stringify(m)):null;if(S.m){S.m.subs=S.m.subs||[];S.m.tactics=S.m.tactics||[];S.m.lineup=Array.isArray(S.m.lineup)?S.m.lineup:[]}render()}
function addOnPitch(id){if(!id)return;var n=S.m.lineup.length;S.m.lineup.push({pid:id,x:20+(n*14)%60,y:50});render()}
function rmPitch(i){S.m.lineup.splice(i,1);render()}
function initDrag(){var pt=$('#pitch');if(!pt)return;pt.querySelectorAll('.dr').forEach(function(el){el.onpointerdown=function(e){e.preventDefault();el.setPointerCapture(e.pointerId);var i=+el.dataset.i,r=pt.getBoundingClientRect();
 el.onpointermove=function(ev){var x=Math.max(5,Math.min(95,(ev.clientX-r.left)/r.width*100)),y=Math.max(5,Math.min(95,(ev.clientY-r.top)/r.height*100));el.style.left=x+'%';el.style.top=y+'%';S.m.lineup[i].x=+x.toFixed(1);S.m.lineup[i].y=+y.toFixed(1)};
 el.onpointerup=function(){el.onpointermove=null}}})}
function newMatch(){S.m={id:crypto.randomUUID(),date:'',opponent:'',logo:'',lineup:[],subs:[],tactics:[],played:false};render()}
async function upLogo(i){var u=await up(i.files[0],'logos');if(u){S.m.logo=u;render()}}
async function saveMatch(){if(await save('matches',S.m)){var id=S.m.id;await reload();pick(id);alert('Сохранено')}}
async function rmMatch(){if(confirm('Удалить матч?')){await sb.from('matches').delete().eq('id',S.m.id);S.m=null;await reload();render()}}

function tRate(){
 var ms=S.M.filter(function(m){return m.played});
 if(!ms.length)return '<div class="box mut">Отметьте матч как «сыгран» во вкладке «Матч и состав» — и здесь появятся оценки.</div>';
 var m=ms.find(function(x){return x.id==S.rm})||ms[0];S.rm=m.id;
 return '<div class="row"><select onchange="S.rm=this.value;render()">'+ms.map(function(x){return '<option value="'+x.id+'"'+(x.id==S.rm?' selected':'')+'>'+esc((x.date||'').slice(0,10))+' vs '+esc(x.opponent)+'</option>'}).join('')+'</select></div>'+
 '<div class="box"><table><tr><th></th>'+STATS.map(function(s){return '<th>'+s[1]+'</th>'}).join('')+'</tr>'+S.P.map(function(p){var r=S.R.find(function(x){return x.id==m.id+'_'+p.id})||{};
 return '<tr><td>'+esc(p.name)+'</td>'+STATS.map(function(s){return '<td><input class="n r_'+s[0]+'" data-p="'+p.id+'" type="number" min="1" max="99" value="'+(r[s[0]]==null?'':r[s[0]])+'"></td>'}).join('')+'</tr>'}).join('')+'</table>'+
 '<p class="mut">Оценки 1–99. Карточка = среднее по всем оценённым матчам.</p><button onclick="saveRatings()">💾 Сохранить оценки</button></div>'}
async function saveRatings(){
 for(var p of S.P){var row={id:S.rm+'_'+p.id,match_id:S.rm,player_id:p.id},any=0;
  STATS.forEach(function(s){var v=document.querySelector('.r_'+s[0]+'[data-p="'+p.id+'"]').value;if(v){row[s[0]]=+v;any=1}});
  if(any)await save('ratings',row)}
 await reload();render();alert('Карточки обновлены')}
init();
</script></body></html>
